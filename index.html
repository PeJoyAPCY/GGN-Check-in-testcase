<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>GGN Check-in / Check-out</title>

  <link
    rel="stylesheet"
    href="./css/style.css"
  >

</head>


<body>

  <div class="logo">

    <img
      src="./logo%20ggn%202016.png"
      alt="โลโก้ GGN"
    >

  </div>


  <h2 class="zone-title" id="zoneTitle">
    ทดสอบ
  </h2>


  <h2 class="system-title">
    📷 ระบบ Check-in / Check-out
  </h2>


  <div class="menu-container">

    <button
      class="menu-button checkin-button"
      id="checkinBtn"
    >
      🟢 เข้างาน
    </button>


    <button
      class="menu-button checkout-button"
      id="checkoutBtn"
    >
      🔴 ออกงาน
    </button>

  </div>


  <div
    id="status"
    class="status"
  ></div>


  <script src="./js/app.js"></script>

</body>

</html>
