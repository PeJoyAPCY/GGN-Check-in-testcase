<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>GGN Check-in / Check-out</title>

  <link
    rel="stylesheet"
    href="./css/style.css"
  >

</head>


<body>


  <!-- =========================================
       LOGO
  ========================================== -->

  <div class="logo">

    <img
      src="./logo%20ggn%202016.png"
      alt="โลโก้ GGN"
    >

  </div>


  <!-- =========================================
       LOCATION
  ========================================== -->

  <section
    class="location-info"
    id="locationInfo"
  >

    <h2
      class="zone-title"
      id="zoneTitle"
    >
      กำลังตรวจสอบจุดตรวจ...
    </h2>


  </section>


  <!-- =========================================
       SYSTEM TITLE
  ========================================== -->

  <h2 class="system-title">

    📷 ระบบ Check-in / Check-out

  </h2>


  <!-- =========================================
       MENU
  ========================================== -->

  <div class="menu-container">


    <button
      type="button"
      class="menu-button checkin-button"
      id="checkinBtn"
    >

      🟢 เข้างาน

    </button>


    <button
      type="button"
      class="menu-button checkout-button"
      id="checkoutBtn"
    >

      🔴 ออกงาน

    </button>


  </div>


  <!-- =========================================
       STATUS
  ========================================== -->

  <div
    id="status"
    class="status"
    role="status"
    aria-live="polite"
  ></div>


  <!-- =========================================
       APP
  ========================================== -->

  <script src="./js/app.js"></script>


</body>

</html>
