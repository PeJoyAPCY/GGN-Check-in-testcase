
<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>GGN Dashboard</title>

  <link
    rel="stylesheet"
    href="./css/style.css"
  >

</head>


<body class="dashboard-page">


  <!-- ==================================================
       DASHBOARD CONTAINER
       ================================================== -->

  <div class="dashboard-container">


    <!-- ==================================================
         HEADER
         ================================================== -->

    <header class="dashboard-header">

      <!-- LOGO -->

      <div class="logo">

        <img
          src="./logo%20ggn%202016.png"
          alt="โลโก้ GGN"
        >

      </div>


      <!-- ZONE -->

      <h2
        class="zone-title"
        id="zoneTitle"
      >
        ทดสอบ
      </h2>


      <!-- SYSTEM TITLE -->

      <h2 class="system-title">
        📊 GGN Dashboard
      </h2>


      <!-- STATUS -->

      <div
        id="dashboardStatus"
        class="dashboard-status"
      >
        ⏳ กำลังโหลดข้อมูล...
      </div>

    </header>


    <!-- ==================================================
         MAIN MENU
         ================================================== -->

    <nav
      class="dashboard-menu dashboard-menu-sticky"
      aria-label="เมนูหลัก"
    >

      <button
        type="button"
        id="dashboardMenuBtn"
        class="dashboard-menu-button dashboard-menu-active"
      >
        📊 Dashboard
      </button>


      <button
        type="button"
        id="qrManagementMenuBtn"
        class="dashboard-menu-button"
      >
        📱 QR Management
      </button>

    </nav>


    <!-- ==================================================
         DASHBOARD PAGE
         ================================================== -->

    <main
      id="dashboardView"
      class="dashboard-view"
    >


      <!-- ==================================================
           PAGE TITLE
           ================================================== -->

      <section class="dashboard-content-header">

        <div>

          <h1>
            📊 Dashboard
          </h1>

          <p>
            ภาพรวมสถานะจุดตรวจทั้งหมด
          </p>

        </div>

      </section>


      <!-- ==================================================
           SUMMARY
           ================================================== -->

      <section
        id="dashboardSummary"
        class="dashboard-summary"
      ></section>


      <!-- ==================================================
           ZONES
           ================================================== -->

      <section
        id="dashboardZones"
        class="dashboard-zones"
      ></section>


      <!-- ==================================================
           REFRESH
           ================================================== -->

      <div class="dashboard-refresh">

        <button
          type="button"
          id="refreshDashboardBtn"
          class="dashboard-refresh-button"
        >
          🔄 รีเฟรชข้อมูล
        </button>

      </div>


    </main>


  </div>


  <!-- ==================================================
       MOBILE BOTTOM NAVIGATION
       ================================================== -->

  <nav
    class="dashboard-bottom-nav"
    aria-label="เมนูหลัก"
  >

    <button
      type="button"
      class="dashboard-bottom-nav-button dashboard-menu-active"
      data-menu-target="dashboardMenuBtn"
    >

      <span class="dashboard-bottom-nav-icon">
        📊
      </span>

      <span class="dashboard-bottom-nav-text">
        Dashboard
      </span>

    </button>


    <button
      type="button"
      class="dashboard-bottom-nav-button"
      data-menu-target="qrManagementMenuBtn"
    >

      <span class="dashboard-bottom-nav-icon">
        📱
      </span>

      <span class="dashboard-bottom-nav-text">
        QR Management
      </span>

    </button>

  </nav>


  <!-- ==================================================
       JAVASCRIPT
       ================================================== -->

  <script src="./js/app.js"></script>

  <script src="./js/dashboard.js"></script>


</body>

</html>
