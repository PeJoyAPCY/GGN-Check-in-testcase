<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>GGN Dashboard</title>

  <link
    rel="stylesheet"
    href="./css/style.css"
  >

</head>


<body class="dashboard-page">


  <!-- ==================================================
       DASHBOARD CONTAINER
       ================================================== -->

  <div class="dashboard-container">


    <!-- ==================================================
         HEADER
         ================================================== -->

    <header class="dashboard-header">


      <!-- LOGO -->

      <div class="logo">

        <img
          src="./logo%20ggn%202016.png"
          alt="โลโก้ GGN"
        >

      </div>


      <!-- ZONE -->

      <h2
        class="zone-title"
        id="zoneTitle"
      >
        ทดสอบ
      </h2>


      <!-- TITLE -->

      <h2 class="system-title">
        📊 GGN Check-in
      </h2>


      <!-- STATUS -->

      <div
        id="dashboardStatus"
        class="dashboard-status"
      >
        ⏳ กำลังโหลดข้อมูล...
      </div>


    </header>


    <!-- ==================================================
         MAIN MENU
         ================================================== -->

    <nav class="dashboard-menu">


      <!-- DASHBOARD -->

      <button
        type="button"
        id="dashboardMenuBtn"
        class="dashboard-menu-button dashboard-menu-active"
      >
        📊 Dashboard
      </button>


      <!-- QR MANAGEMENT -->

      <button
        type="button"
        id="qrManagementMenuBtn"
        class="dashboard-menu-button"
      >
        📱 QR Management
      </button>


    </nav>


    <!-- ==================================================
         DASHBOARD VIEW
         ================================================== -->

    <main
      id="dashboardView"
      class="dashboard-view"
    >


      <!-- ==================================================
           SUMMARY
           ================================================== -->

      <section
        id="dashboardSummary"
        class="dashboard-summary"
      ></section>


      <!-- ==================================================
           ZONES
           ================================================== -->

      <section
        id="dashboardZones"
        class="dashboard-zones"
      ></section>


      <!-- ==================================================
           REFRESH
           ================================================== -->

      <div class="dashboard-refresh">

        <button
          type="button"
          id="refreshDashboardBtn"
          class="dashboard-refresh-button"
        >
          🔄 รีเฟรชข้อมูล
        </button>

      </div>


    </main>


  </div>


  <!-- ==================================================
       JAVASCRIPT
       ================================================== -->

  <script src="./js/app.js"></script>

  <script src="./js/dashboard.js"></script>


</body>

</html>
