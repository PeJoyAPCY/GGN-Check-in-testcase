<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>GGN Dashboard</title>

  <link
    rel="stylesheet"
    href="./css/style.css"
  >

</head>


<body>

  <!-- ==================================================
       LOGO
       ================================================== -->

  <div class="logo">

    <img
      src="./logo%20ggn%202016.png"
      alt="โลโก้ GGN"
    >

  </div>


  <!-- ==================================================
       ZONE
       ================================================== -->

  <h2
    class="zone-title"
    id="zoneTitle"
  >
    ทดสอบ
  </h2>


  <!-- ==================================================
       SYSTEM TITLE
       ================================================== -->

  <h2 class="system-title">

    📊 Dashboard

  </h2>


  <!-- ==================================================
       STATUS
       ================================================== -->

  <div
    id="dashboardStatus"
    class="status"
  >
    ⏳ กำลังโหลดข้อมูล...
  </div>


  <!-- ==================================================
       SUMMARY
       ================================================== -->

  <div
    id="dashboardSummary"
    class="dashboard-summary"
  ></div>


  <!-- ==================================================
       ZONES
       ================================================== -->

  <div
    id="dashboardZones"
    class="dashboard-zones"
  ></div>


  <!-- ==================================================
       REFRESH
       ================================================== -->

  <button
    type="button"
    id="refreshDashboardBtn"
  >
    🔄 รีเฟรชข้อมูล
  </button>


  <!-- ==================================================
       JAVASCRIPT
       ================================================== -->

  <script src="./js/app.js"></script>
  <script src="./js/dashboard.js"></script>

</body>

</html>
