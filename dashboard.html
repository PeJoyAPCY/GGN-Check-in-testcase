<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>GGN Dashboard</title>

  <link
    rel="stylesheet"
    href="./css/style.css"
  >

</head>


<body class="dashboard-page">


  <!-- ==================================================
       DASHBOARD CONTAINER
       ================================================== -->

  <div class="dashboard-container">


    <!-- ==================================================
         HEADER
         ================================================== -->

    <header class="dashboard-header">


      <!-- LOGO -->

      <div class="logo">

        <img
          src="./logo%20ggn%202016.png"
          alt="โลโก้ GGN"
        >

      </div>


      <!-- ZONE -->

      <h2
        class="zone-title"
        id="zoneTitle"
      >
        ทดสอบ
      </h2>


      <!-- TITLE -->

      <h2 class="system-title">
        📊 GGN Check-in
      </h2>


      <!-- STATUS -->

      <div
        id="dashboardStatus"
        class="dashboard-status"
      >
        ⏳ กำลังโหลดข้อมูล...
      </div>


    </header>


    <!-- ==================================================
         MAIN MENU
         ================================================== -->

    <nav class="dashboard-menu">


      <button
        type="button"
        id="dashboardMenuBtn"
        class="dashboard-menu-button dashboard-menu-active"
      >
        📊 Dashboard
      </button>


      <button
        type="button"
        id="qrManagementMenuBtn"
        class="dashboard-menu-button"
      >
        📱 QR Management
      </button>


    </nav>


    <!-- ==================================================
         DASHBOARD VIEW
         ================================================== -->

    <main
      id="dashboardView"
      class="dashboard-view"
    >


      <!-- ==================================================
           SUMMARY
           ================================================== -->

      <section
        id="dashboardSummary"
        class="dashboard-summary"
      ></section>


      <!-- ==================================================
           ZONES
           ================================================== -->

      <section
        id="dashboardZones"
        class="dashboard-zones"
      ></section>


      <!-- ==================================================
           REFRESH
           ================================================== -->

      <div class="dashboard-refresh">

        <button
          type="button"
          id="refreshDashboardBtn"
          class="dashboard-refresh-button"
        >
          🔄 รีเฟรชข้อมูล
        </button>

      </div>


    </main>


    <!-- ==================================================
         QR MANAGEMENT VIEW
         ================================================== -->

    <main
      id="qrManagementView"
      class="qr-management-view"
      hidden
    >


      <!-- ==================================================
           QR HEADER
           ================================================== -->

      <section class="qr-management-header">

        <div>

          <h2>
            📱 QR Management
          </h2>

          <p>
            จัดการ QR Code สำหรับแต่ละจุดตรวจ
          </p>

        </div>

      </section>


      <!-- ==================================================
           QR SUMMARY
           ================================================== -->

      <section
        id="qrManagementSummary"
        class="qr-management-summary"
      ></section>


      <!-- ==================================================
           QR ACTION BAR
           ================================================== -->

      <section class="qr-management-actions">


        <button
          type="button"
          id="qrSelectAllBtn"
          class="qr-action-button"
        >
          ☑️ เลือกทั้งหมด
        </button>


        <button
          type="button"
          id="qrClearSelectionBtn"
          class="qr-action-button secondary"
        >
          ◻️ ยกเลิกการเลือก
        </button>


        <button
          type="button"
          id="qrRefreshBtn"
          class="qr-action-button"
        >
          🔄 โหลดรายการใหม่
        </button>


      </section>


      <!-- ==================================================
           QR LOCATIONS
           ================================================== -->

      <section
        id="qrLocations"
        class="qr-locations"
      ></section>


      <!-- ==================================================
           QR SELECTION INFO
           ================================================== -->

      <section
        id="qrSelectionInfo"
        class="qr-selection-info"
      >

        เลือกจุดตรวจที่ต้องการจัดการ

      </section>


      <!-- ==================================================
           QR FUTURE ACTION
           ================================================== -->

      <section class="qr-generation-panel">


        <div class="qr-generation-icon">
          📱
        </div>


        <h3>
          สร้าง QR Code
        </h3>


        <p>
          ส่วนสร้าง QR Code และระบบพิมพ์
          จะพัฒนาต่อในขั้นถัดไป
        </p>


        <div class="qr-generation-status">

          🔒 รอการพัฒนาส่วนสร้าง QR

        </div>


      </section>


    </main>


  </div>


  <!-- ==================================================
       JAVASCRIPT
       ================================================== -->

  <script src="./js/app.js"></script>

  <script src="./js/dashboard.js"></script>

  <script src="./js/qr.js"></script>

</body>

</html>
