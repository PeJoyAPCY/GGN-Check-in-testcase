<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>GGN Dashboard</title>

  <link
    rel="stylesheet"
    href="./css/style.css"
  >

</head>


<body class="dashboard-page">


  <!-- ==================================================
       APP SHELL
       ================================================== -->

  <div class="dashboard-app-shell">


    <!-- ==================================================
         SIDEBAR
         Desktop
         ================================================== -->

    <aside
      class="dashboard-sidebar"
      aria-label="เมนูหลัก"
    >


      <!-- ==================================================
           BRAND
           ================================================== -->

      <div class="dashboard-sidebar-brand">

        <div class="dashboard-sidebar-logo">

          <img
            src="./logo%20ggn%202016.png"
            alt="โลโก้ GGN"
          >

        </div>

        <div class="dashboard-sidebar-brand-text">

          <strong>GGN</strong>

          <span>CHECK-IN</span>

        </div>

      </div>


      <!-- ==================================================
           SYSTEM
           ================================================== -->

      <div class="dashboard-sidebar-system">

        <span>ระบบจัดการการเข้า-ออกงาน</span>

      </div>


      <!-- ==================================================
           NAVIGATION
           ================================================== -->

      <nav
        class="dashboard-sidebar-nav"
        aria-label="เมนูหลัก"
      >


        <button
          type="button"
          id="dashboardMenuBtn"
          class="dashboard-menu-button dashboard-menu-active"
        >

          <span class="dashboard-menu-icon">📊</span>

          <span class="dashboard-menu-text">
            Dashboard
          </span>

        </button>


        <button
          type="button"
          id="qrManagementMenuBtn"
          class="dashboard-menu-button"
        >

          <span class="dashboard-menu-icon">📱</span>

          <span class="dashboard-menu-text">
            QR Management
          </span>

        </button>


      </nav>


      <!-- ==================================================
           SIDEBAR FOOTER
           ================================================== -->

      <div class="dashboard-sidebar-footer">

        <span>
          GGN Check-in
        </span>

      </div>


    </aside>


    <!-- ==================================================
         MAIN AREA
         ================================================== -->

    <div class="dashboard-main-area">


      <!-- ==================================================
           TOP HEADER
           ================================================== -->

      <header class="dashboard-topbar">


        <div class="dashboard-topbar-title">

          <div class="dashboard-topbar-icon">
            📊
          </div>

          <div>

            <h1>
              GGN Check-in
            </h1>

            <p>
              ระบบติดตามการเข้า-ออกงาน
            </p>

          </div>

        </div>


        <!-- ==================================================
             ZONE
             ================================================== -->

        <div class="dashboard-topbar-zone">

          <span class="dashboard-topbar-zone-label">
            จุดตรวจ
          </span>

          <strong
            id="zoneTitle"
            class="zone-title"
          >
            ทดสอบ
          </strong>

        </div>


      </header>


      <!-- ==================================================
           STATUS BAR
           ================================================== -->

      <div
        id="dashboardStatus"
        class="dashboard-status"
      >
        ⏳ กำลังโหลดข้อมูล...
      </div>


      <!-- ==================================================
           CONTENT
           ================================================== -->

      <main
        id="dashboardView"
        class="dashboard-view"
      >


        <!-- ==================================================
             PAGE HEADER
             ================================================== -->

        <section class="dashboard-content-header">

          <div>

            <h2>
              📊 Dashboard
            </h2>

            <p>
              ภาพรวมสถานะจุดตรวจทั้งหมด
            </p>

          </div>

        </section>


        <!-- ==================================================
             SUMMARY
             ================================================== -->

        <section
          id="dashboardSummary"
          class="dashboard-summary"
        ></section>


        <!-- ==================================================
             ZONES
             ================================================== -->

        <section
          id="dashboardZones"
          class="dashboard-zones"
        ></section>


        <!-- ==================================================
             REFRESH
             ================================================== -->

        <div class="dashboard-refresh">

          <button
            type="button"
            id="refreshDashboardBtn"
            class="dashboard-refresh-button"
          >
            🔄 รีเฟรชข้อมูล
          </button>

        </div>


      </main>


    </div>


  </div>


  <!-- ==================================================
       MOBILE BOTTOM NAVIGATION
       ================================================== -->

  <nav
    class="dashboard-bottom-nav"
    aria-label="เมนูหลัก"
  >


    <button
      type="button"
      class="dashboard-bottom-nav-button dashboard-menu-active"
      data-menu-target="dashboardMenuBtn"
    >

      <span class="dashboard-bottom-nav-icon">
        📊
      </span>

      <span class="dashboard-bottom-nav-text">
        Dashboard
      </span>

    </button>


    <button
      type="button"
      class="dashboard-bottom-nav-button"
      data-menu-target="qrManagementMenuBtn"
    >

      <span class="dashboard-bottom-nav-icon">
        📱
      </span>

      <span class="dashboard-bottom-nav-text">
        QR Management
      </span>

    </button>


  </nav>


  <!-- ==================================================
       JAVASCRIPT
       ================================================== -->

  <script src="./js/app.js"></script>

  <script src="./js/dashboard.js"></script>


</body>

</html>
