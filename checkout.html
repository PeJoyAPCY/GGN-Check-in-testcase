<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>GGN Check-out</title>

  <link
    rel="stylesheet"
    href="./css/style.css"
  >

</head>


<body>

  <div class="logo">

    <img
      src="./logo%20ggn%202016.png"
      alt="โลโก้ GGN"
    >

  </div>


  <h2 class="zone-title" id="zoneTitle">
    ทดสอบ
  </h2>


  <h2 class="system-title">
    🔴 Check-out ออกงาน
  </h2>


  <div class="form-container">


    <!-- ชื่อ -->

    <input
      type="text"
      id="fullname"
      placeholder="ชื่อ-นามสกุล (บังคับกรอก)"
      autocomplete="name"
    >


    <!-- ประเภทงาน -->

    <div class="job-type">

      <label>

        <input
          type="radio"
          name="jobType"
          value="รปภ."
        >

        รปภ.

      </label>


      <label>

        <input
          type="radio"
          name="jobType"
          value="สายตรวจ"
        >

        สายตรวจ

      </label>

    </div>


    <!-- ข้อความเพิ่มเติม -->

    <textarea
      id="text"
      rows="2"
      placeholder="หมายเหตุ (ถ้ามี)"
    ></textarea>


    <!-- Preview -->

    <div id="previewText"></div>


    <!-- ส่ง -->

    <button
      id="sendBtn"
    >
      📤 ส่งข้อมูล Check-out
    </button>


    <!-- สถานะ -->

    <div id="status"></div>


  </div>


  <canvas id="canvas"></canvas>


  <script src="./js/app.js"></script>

</body>

</html>
