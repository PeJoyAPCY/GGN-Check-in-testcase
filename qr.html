<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>GGN QR Management</title>

  <link
    rel="stylesheet"
    href="./css/style.css"
  >

</head>


<body class="dashboard-page">


  <!-- ==================================================
       QR MANAGEMENT CONTAINER
       ================================================== -->

  <div class="dashboard-container">


    <!-- ==================================================
         HEADER
         ================================================== -->

    <header class="dashboard-header">


      <!-- LOGO -->

      <div class="logo">

        <img
          src="./logo%20ggn%202016.png"
          alt="โลโก้ GGN"
        >

      </div>


      <!-- ZONE -->

      <h2
        class="zone-title"
        id="zoneTitle"
      >
        ทดสอบ
      </h2>


      <!-- TITLE -->

      <h2 class="system-title">
        📱 QR Management
      </h2>


      <!-- STATUS -->

      <div
        id="qrStatus"
        class="dashboard-status"
      >
        ⏳ กำลังโหลดข้อมูล...
      </div>


    </header>


    <!-- ==================================================
         QR MANAGEMENT TOOLBAR
         ================================================== -->

    <section class="qr-management-toolbar">


      <!-- ==================================================
           TOOLBAR TITLE
           ================================================== -->

      <div class="qr-management-title">

        <h3>
          📱 จัดการ QR Code จุดตรวจ
        </h3>

        <p>
          เลือกจุดตรวจที่ต้องการสร้างหรือพิมพ์ QR Code
        </p>

      </div>


      <!-- ==================================================
           ACTION BUTTONS
           ================================================== -->

      <div class="qr-management-actions">


        <!-- SELECT ALL -->

        <button
          type="button"
          id="selectAllQrBtn"
          class="qr-action-button"
        >
          ☑️ เลือกทั้งหมด
        </button>


        <!-- CLEAR -->

        <button
          type="button"
          id="clearAllQrBtn"
          class="qr-action-button"
        >
          ⬜ ยกเลิกทั้งหมด
        </button>


        <!-- CREATE -->

        <button
          type="button"
          id="createQrBtn"
          class="qr-action-button qr-create-button"
        >
          📱 สร้าง QR
        </button>


        <!-- PRINT SELECTED -->

        <button
          type="button"
          id="printSelectedQrBtn"
          class="qr-action-button qr-print-button"
        >
          🖨️ พิมพ์จุดที่เลือก
        </button>


        <!-- PRINT ALL -->

        <button
          type="button"
          id="printAllQrBtn"
          class="qr-action-button qr-print-all-button"
        >
          🖨️ พิมพ์ทั้งหมด
        </button>


      </div>


    </section>


    <!-- ==================================================
         SELECTION SUMMARY
         ================================================== -->

    <section
      class="qr-selection-summary"
      id="qrSelectionSummary"
    >


      <div class="qr-summary-item">

        <span class="qr-summary-label">
          จุดทั้งหมด
        </span>

        <strong
          id="qrTotalCount"
          class="qr-summary-value"
        >
          0
        </strong>

      </div>


      <div class="qr-summary-item">

        <span class="qr-summary-label">
          จุด Active
        </span>

        <strong
          id="qrActiveCount"
          class="qr-summary-value"
        >
          0
        </strong>

      </div>


      <div class="qr-summary-item">

        <span class="qr-summary-label">
          เลือกแล้ว
        </span>

        <strong
          id="qrSelectedCount"
          class="qr-summary-value"
        >
          0
        </strong>

      </div>


    </section>


    <!-- ==================================================
         LOCATION LIST
         ================================================== -->

    <main
      id="qrLocationList"
      class="qr-location-list"
    >


      <!-- ==================================================
           LOADING
           ================================================== -->

      <div
        id="qrLoading"
        class="qr-empty-state"
      >

        ⏳ กำลังโหลดรายการจุดตรวจ...

      </div>


    </main>


    <!-- ==================================================
         QR PREVIEW SECTION
         ================================================== -->

    <section
      id="qrPreviewSection"
      class="qr-preview-section"
    >


      <!-- ==================================================
           PREVIEW HEADER
           ================================================== -->

      <div class="qr-preview-header">


        <div>

          <h3>
            📱 QR Code
          </h3>

          <p>
            ตัวอย่าง QR Code สำหรับนำไปติดตั้งที่จุดตรวจ
          </p>

        </div>


        <div
          id="qrPreviewCount"
          class="qr-preview-count"
        >
          0 จุด
        </div>


      </div>


      <!-- ==================================================
           QR PREVIEW GRID
           ================================================== -->

      <div
        id="qrPreviewGrid"
        class="qr-preview-grid"
      >


        <div class="qr-empty-state">

          ยังไม่มี QR Code

        </div>


      </div>


    </section>


    <!-- ==================================================
         PRINT AREA
         ================================================== -->

    <section
      id="qrPrintArea"
      class="qr-print-area"
    >


      <!--
        พื้นที่นี้เตรียมไว้สำหรับระบบพิมพ์
        ในขั้นตอนถัดไป

        รูปแบบเป้าหมาย:

        1 แผ่น
        ┌────────┬────────┬────────┬────────┐
        │ QR 01  │ QR 02  │ QR 03  │ QR 04  │
        ├────────┼────────┼────────┼────────┤
        │ QR 05  │ QR 06  │ QR 07  │ QR 08  │
        └────────┴────────┴────────┴────────┘

        = 8 QR / 1 แผ่น
      -->


    </section>


    <!-- ==================================================
         REFRESH
         ================================================== -->

    <div class="dashboard-refresh">


      <button
        type="button"
        id="refreshQrBtn"
        class="dashboard-refresh-button"
      >
        🔄 รีเฟรชรายการจุด
      </button>


    </div>


  </div>


  <!-- ==================================================
       JAVASCRIPT
       ================================================== -->

  <script src="./js/app.js"></script>

  <script src="./js/qr.js"></script>


</body>

</html>
