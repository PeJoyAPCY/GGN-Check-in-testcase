<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>GGN QR Management</title>

  <link
    rel="stylesheet"
    href="./css/style.css"
  >

</head>


<body class="dashboard-page">


  <!-- ==================================================
       QR MANAGEMENT CONTAINER
       ================================================== -->

  <div class="dashboard-container">


    <!-- ==================================================
         HEADER
         ================================================== -->

    <header class="dashboard-header">


      <!-- LOGO -->

      <div class="logo">

        <img
          src="./logo%20ggn%202016.png"
          alt="โลโก้ GGN"
        >

      </div>


      <!-- ZONE -->

      <h2
        class="zone-title"
        id="zoneTitle"
      >
        ทดสอบ
      </h2>


      <!-- SYSTEM TITLE -->

      <h2 class="system-title">
        📱 QR Management
      </h2>


      <!-- STATUS -->

      <div
        id="qrStatus"
        class="dashboard-status"
      >
        ⏳ กำลังโหลดข้อมูล...
      </div>


    </header>


    <!-- ==================================================
         MAIN MENU
         ================================================== -->

    <nav
      class="dashboard-menu dashboard-menu-sticky"
      aria-label="เมนูหลัก"
    >

      <button
        type="button"
        id="dashboardMenuBtn"
        class="dashboard-menu-button"
      >
        📊 Dashboard
      </button>


      <button
        type="button"
        id="qrManagementMenuBtn"
        class="dashboard-menu-button dashboard-menu-active"
      >
        📱 QR Management
      </button>

    </nav>


    <!-- ==================================================
         QR MANAGEMENT
         ================================================== -->

    <main
      id="qrManagementPage"
      class="qr-management-view"
    >


      <!-- ==================================================
           PAGE TITLE
           ================================================== -->

      <section class="qr-management-header">

        <div>

          <h2>
            📱 QR MANAGEMENT
          </h2>

          <p>
            จัดการ QR Code จุดตรวจทั้งหมด
          </p>

        </div>

      </section>


      <!-- ==================================================
           SEARCH & FILTER
           ================================================== -->

      <section class="qr-filter-panel">


        <!-- SEARCH -->

        <div class="qr-search-box">

          <label
            for="qrSearchInput"
            class="qr-filter-label"
          >
            🔎 ค้นหาจุดตรวจ
          </label>


          <input
            type="text"
            id="qrSearchInput"
            class="qr-search-input"
            placeholder="ค้นหา จุดตรวจ / Point ID / เขต"
            autocomplete="off"
          >

        </div>


        <!-- ZONE FILTER -->

        <div class="qr-filter-box">

          <label
            for="qrZoneFilter"
            class="qr-filter-label"
          >
            เขต
          </label>


          <select
            id="qrZoneFilter"
            class="qr-filter-select"
          >

            <option value="">
              ทุกเขต
            </option>

          </select>

        </div>


        <!-- STATUS FILTER -->

        <div class="qr-filter-box">

          <label
            for="qrStatusFilter"
            class="qr-filter-label"
          >
            สถานะ
          </label>


          <select
            id="qrStatusFilter"
            class="qr-filter-select"
          >

            <option value="">
              ทุกสถานะ
            </option>

            <option value="active">
              Active
            </option>

            <option value="inactive">
              Inactive
            </option>

          </select>

        </div>


        <!-- QR FILTER -->

        <div class="qr-filter-box">

          <label
            for="qrExistFilter"
            class="qr-filter-label"
          >
            QR
          </label>


          <select
            id="qrExistFilter"
            class="qr-filter-select"
          >

            <option value="">
              ทั้งหมด
            </option>

            <option value="hasQR">
              มี QR
            </option>

            <option value="noQR">
              ยังไม่มี QR
            </option>

          </select>

        </div>


      </section>


      <!-- ==================================================
           SUMMARY
           ================================================== -->

      <section
        class="qr-selection-summary"
        id="qrSelectionSummary"
      >


        <!-- TOTAL -->

        <div class="qr-summary-item">

          <span class="qr-summary-label">
            จุดทั้งหมด
          </span>

          <strong
            id="qrTotalCount"
            class="qr-summary-value"
          >
            0
          </strong>

        </div>


        <!-- ACTIVE -->

        <div class="qr-summary-item">

          <span class="qr-summary-label">
            เปิดใช้งาน
          </span>

          <strong
            id="qrActiveCount"
            class="qr-summary-value"
          >
            0
          </strong>

        </div>


        <!-- HAS QR -->

        <div class="qr-summary-item">

          <span class="qr-summary-label">
            มี QR
          </span>

          <strong
            id="qrHasQrCount"
            class="qr-summary-value"
          >
            0
          </strong>

        </div>


        <!-- SELECTED -->

        <div class="qr-summary-item">

          <span class="qr-summary-label">
            เลือกแล้ว
          </span>

          <strong
            id="qrSelectedCount"
            class="qr-summary-value"
          >
            0
          </strong>

        </div>


      </section>


      <!-- ==================================================
           TOOLBAR
           ================================================== -->

      <section class="qr-management-toolbar">


        <!-- SELECT -->

        <div class="qr-selection-tools">

          <button
            type="button"
            id="selectAllQrBtn"
            class="qr-action-button"
          >
            ☑️ เลือกทั้งหมด
          </button>


          <button
            type="button"
            id="clearAllQrBtn"
            class="qr-action-button secondary"
          >
            ◻️ ยกเลิกทั้งหมด
          </button>

        </div>


        <!-- ACTION -->

        <div class="qr-management-actions">

          <button
            type="button"
            id="createQrBtn"
            class="qr-action-button qr-create-button"
          >
            📱 สร้าง QR
          </button>


          <button
            type="button"
            id="printSelectedQrBtn"
            class="qr-action-button qr-print-button"
          >
            🖨️ พิมพ์จุดที่เลือก
          </button>


          <button
            type="button"
            id="printAllQrBtn"
            class="qr-action-button qr-print-all-button"
          >
            🖨️ พิมพ์ทั้งหมด
          </button>

        </div>


      </section>


      <!-- ==================================================
           LIST HEADER
           ================================================== -->

      <section class="qr-list-control">


        <div class="qr-list-info">

          <strong>
            📍 รายการจุดตรวจ
          </strong>


          <span id="qrResultCount">
            0 จุด
          </span>

        </div>


        <!-- ITEMS PER PAGE -->

        <div class="qr-page-size">

          <label
            for="qrPageSize"
          >
            แสดง
          </label>


          <select
            id="qrPageSize"
            class="qr-filter-select"
          >

            <option value="25">
              25 รายการ
            </option>

            <option value="50">
              50 รายการ
            </option>

            <option value="100">
              100 รายการ
            </option>

            <option value="all">
              ทั้งหมด
            </option>

          </select>

        </div>


      </section>


      <!-- ==================================================
           LOCATION LIST
           ================================================== -->

      <section
        id="qrLocationList"
        class="qr-location-list"
      >


        <!-- LOADING -->

        <div
          id="qrLoading"
          class="qr-empty-state"
        >
          ⏳ กำลังโหลดรายการจุดตรวจ...
        </div>


      </section>


      <!-- ==================================================
           PAGINATION
           ================================================== -->

      <nav
        id="qrPagination"
        class="qr-pagination"
        aria-label="เปลี่ยนหน้ารายการจุดตรวจ"
      >

      </nav>


      <!-- ==================================================
           QR PREVIEW
           ================================================== -->

      <section
        id="qrPreviewSection"
        class="qr-preview-section"
      >


        <!-- PREVIEW HEADER -->

        <div class="qr-preview-header">


          <div>

            <h3>
              📱 QR Code Preview
            </h3>

            <p>
              ตัวอย่าง QR Code สำหรับนำไปติดตั้งที่จุดตรวจ
            </p>

          </div>


          <div
            id="qrPreviewCount"
            class="qr-preview-count"
          >
            0 จุด
          </div>


        </div>


        <!-- PREVIEW GRID -->

        <div
          id="qrPreviewGrid"
          class="qr-preview-grid"
        >

          <div class="qr-empty-state">
            ยังไม่มี QR Code
          </div>

        </div>


      </section>


      <!-- ==================================================
           PRINT AREA
           ================================================== -->

      <section
        id="qrPrintArea"
        class="qr-print-area"
      >

        <!--

          พื้นที่สำหรับระบบพิมพ์ QR

          ขั้นต่อไปจะพัฒนาเป็น:

          1 แผ่น = 8 QR

          ┌────────┬────────┬────────┬────────┐
          │ QR 01  │ QR 02  │ QR 03  │ QR 04  │
          ├────────┼────────┼────────┼────────┤
          │ QR 05  │ QR 06  │ QR 07  │ QR 08  │
          └────────┴────────┴────────┴────────┘

        -->

      </section>


      <!-- ==================================================
           REFRESH
           ================================================== -->

      <div class="dashboard-refresh">

        <button
          type="button"
          id="refreshQrBtn"
          class="dashboard-refresh-button"
        >
          🔄 รีเฟรชรายการจุด
        </button>

      </div>


    </main>


  </div>


  <!-- ==================================================
       JAVASCRIPT
       ================================================== -->

  <script src="./js/app.js"></script>


  <!-- ==================================================
       QR CODE LIBRARY
       ================================================== -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>


  <!-- ==================================================
       QR MANAGEMENT
       ================================================== -->

  <script src="./js/qr.js"></script>


</body>

</html>
